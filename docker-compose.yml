# One-time setup, before first `docker compose up`:
#   docker network create schloss-net
#   git submodule update --init
# schlussel runs from its own repo (see schlussel/docker-compose.yml) and
# must be on the same network for schrank-backend to reach it by hostname.
#
# Neither service publishes a host port - both are reached through the
# tor gateway (see https://github.com/zudaR107/tor), which is the only
# container that binds to a host port. `schrank-data` is given a fixed
# name so it's the same physical volume whether this compose file is run
# standalone or included from tor's.
services:
  schrank-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3005
      DATABASE_PATH: /data/schrank.db
      # File bytes live under here (files/<ownerUserId>/<fileId>), on the
      # same volume as the database - one volume to back up, not two.
      DATA_DIR: /data
      MAX_FILE_BYTES: ${SCHRANK_MAX_FILE_BYTES:-209715200}
      MAX_BYTES_PER_USER: ${SCHRANK_MAX_BYTES_PER_USER:-2147483648}
      SCHLUSSEL_JWKS_URL: ${SCHLUSSEL_JWKS_URL:-http://schlussel:4000/.well-known/jwks.json}
      # Must match schlussel's own JWT_ISSUER (hardcoded to "schlussel" in
      # schlussel/docker-compose.yml).
      JWT_ISSUER: ${JWT_ISSUER:-schlussel}
      # Substitution var is SCHRANK_ALLOWED_ORIGINS, not ALLOWED_ORIGINS -
      # when tor's docker-compose.yml includes this file alongside every
      # other service's, they'd otherwise all read the exact same outer
      # variable name, silently overriding each other. Container-internal
      # env var name is still plain ALLOWED_ORIGINS below - only the
      # outer name changed.
      ALLOWED_ORIGINS: ${SCHRANK_ALLOWED_ORIGINS:-https://localhost,https://schrank.localhost}
      # Zettel note-mirroring sync (see backend/src/sync/outbox.ts and
      # sync/inbox.ts) - two independent HMAC pairs, one per direction,
      # never the same secret reused (matches the platform's own
      # directional-credential convention). Left unset, events still get
      # recorded (see features/files/router.ts, features/folders/router.ts)
      # but queue up undelivered.
      ZETTEL_BASE_URL: ${ZETTEL_BASE_URL:-http://zettel-backend:3003}
      SCHRANK_TO_ZETTEL_HMAC_KEY_ID: ${SCHRANK_TO_ZETTEL_HMAC_KEY_ID:-}
      SCHRANK_TO_ZETTEL_HMAC_SECRET: ${SCHRANK_TO_ZETTEL_HMAC_SECRET:-}
      ZETTEL_TO_SCHRANK_HMAC_KEY_ID: ${ZETTEL_TO_SCHRANK_HMAC_KEY_ID:-}
      ZETTEL_TO_SCHRANK_HMAC_SECRET: ${ZETTEL_TO_SCHRANK_HMAC_SECRET:-}
      SCHRANK_TO_ZETTEL_DISPATCH_INTERVAL_MS: ${SCHRANK_TO_ZETTEL_DISPATCH_INTERVAL_MS:-1000}
      SCHRANK_TO_ZETTEL_OUTBOX_LEASE_MS: ${SCHRANK_TO_ZETTEL_OUTBOX_LEASE_MS:-30000}
      SCHRANK_TO_ZETTEL_FETCH_TIMEOUT_MS: ${SCHRANK_TO_ZETTEL_FETCH_TIMEOUT_MS:-10000}
      SCHRANK_TO_ZETTEL_WORKER_STOP_TIMEOUT_MS: ${SCHRANK_TO_ZETTEL_WORKER_STOP_TIMEOUT_MS:-5000}
      SCHRANK_TO_ZETTEL_MAX_ATTEMPTS: ${SCHRANK_TO_ZETTEL_MAX_ATTEMPTS:-8}
      SCHRANK_TO_ZETTEL_RETRY_BASE_DELAY_MS: ${SCHRANK_TO_ZETTEL_RETRY_BASE_DELAY_MS:-1000}
      SCHRANK_TO_ZETTEL_RETRY_MAX_DELAY_MS: ${SCHRANK_TO_ZETTEL_RETRY_MAX_DELAY_MS:-900000}
      SCHRANK_TO_ZETTEL_OUTBOX_RETENTION_MS: ${SCHRANK_TO_ZETTEL_OUTBOX_RETENTION_MS:-604800000}
    volumes:
      - schrank-data:/data
    networks:
      - schloss-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  schrank-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SCHLUSSEL_URL: ${SCHLUSSEL_WEB_URL:-https://auth.localhost}
        VITE_SCHLOSS_URL: ${SCHLOSS_URL:-https://localhost}
        VITE_GLOCKE_URL: ${GLOCKE_URL:-https://glocke.localhost}
    restart: unless-stopped
    networks:
      - schloss-net
    depends_on:
      - schrank-backend

volumes:
  schrank-data:
    name: schrank-data

networks:
  schloss-net:
    external: true
